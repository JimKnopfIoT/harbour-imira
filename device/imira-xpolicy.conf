# harbour-imira — PulseAudio policy exception for the cast daemon.
# Installed to /etc/pulse/xpolicy.conf.d/imira.conf; PulseAudio reads it on
# its next start (the package %post restarts it).
#
# imira-castd records the media sink's monitor (sink.deep_buffer.monitor) to
# put the phone's audio output into the Miracast stream. Without this rule
# the stream falls into the default "othermedia" policy group, whose
# route_audio flag makes module-policy-enforcement re-route every record
# stream onto the active input — the microphone — no matter which device it
# asked for. A nopolicy group keeps the stream where it connected; the
# daemon additionally verifies it really sits on a *.monitor source and
# disables audio otherwise, so microphone audio can never be transmitted.

[group]
name  = imiracast
flags = nopolicy

[stream]
property = application.name@equals:"imira-castd"
group    = imiracast
